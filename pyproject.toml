[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinkercad-mcp"
version = "0.1.0"
description = "MCP server for Tinkercad 3D design and circuit automation via browser"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "tinkercad", "3d", "circuits", "playwright", "autodesk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.0",
]

[project.scripts]
tinkercad-mcp = "tinkercad_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tinkercad_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
